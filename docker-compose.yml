services:

  # PHP Application
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
      args:
        user: schooluser
        uid: 1000
    image: school-app
    container_name: school-app-container
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - .:/var/www
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - school-network

  # Nginx Web Server
  web:
    image: nginx:alpine
    container_name: school-web-container
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - .:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - school-network

  # MySQL Database
  mysql:
    image: mysql:8.0
    container_name: school-mysql-container
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-school_db}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-secret}
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
      MYSQL_USER: ${DB_USERNAME:-school_user}
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_PASSWORD:-secret}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - school-network

  # Redis for Cache/Queue
  redis:
    image: redis:alpine
    container_name: school-redis-container
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - school-network

volumes:
  mysql-data:
    driver: local
  redis-data:
    driver: local

networks:
  school-network:
    driver: bridge
