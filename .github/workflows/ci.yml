name: 🧪 SISTA Continuous Integration

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─────────────────────────────────────────────
  # Code Style Check (Laravel Pint)
  # ─────────────────────────────────────────────
  code-style:
    name: 🎨 Lint & Style
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          tools: composer:v2

      - name: Cache Composer Dependencies
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-

      - name: Install Dependencies
        run: composer install --no-ansi --no-interaction --no-scripts --no-progress --prefer-dist

      - name: Run Laravel Pint Linting
        run: vendor/bin/pint --test

  # ─────────────────────────────────────────────
  # Automation Test Suite
  # ─────────────────────────────────────────────
  tests:
    name: 🧪 Automated Test Suite
    runs-on: ubuntu-latest
    needs: [code-style]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup PHP Environment
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: mbstring, pdo_sqlite, pdo_mysql, bcmath, gd, zip, exif, pcntl
          coverage: none

      - name: Cache Composer Dependencies
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-

      - name: Copy Environment Parameters
        run: cp .env.example .env

      - name: Install PHP Dependencies
        run: composer install --no-ansi --no-interaction --no-scripts --no-progress --prefer-dist

      - name: Setup Node.js Build Engine
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install NPM Dependencies
        run: npm ci --ignore-scripts

      - name: Compile Premium Web Assets
        run: npm run build

      - name: Generate Secure Application Key
        run: php artisan key:generate

      - name: Setup Storage Permissions
        run: chmod -R 777 storage bootstrap/cache

      - name: Initialize Isolation Test Database
        run: |
          mkdir -p database
          touch database/database.sqlite

      - name: Execute Migration Engine
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: database/database.sqlite
        run: php artisan migrate --force

      - name: Execute Pest/PHPUnit Test Suite
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: database/database.sqlite
        run: php -d memory_limit=-1 artisan test
