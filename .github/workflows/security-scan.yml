name: Security Scan

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

jobs:
  security-audit:
    name: Security Scan & Audit (SAST)
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.4'
        extensions: mbstring, xml, ctype, iconv, sqlite3
        coverage: none

    - name: Install Dependencies
      run: composer install --prefer-dist --no-progress

    - name: Run Larastan (Static Analysis)
      run: vendor/bin/phpstan analyse --error-format=github

    - name: Dependency Vulnerability Audit
      run: composer audit

  # Scans the app booted inside this runner (production settings, fresh
  # SQLite), so it runs on every PR and push without a staging server — the
  # old target (staging.sultanagung1.sch.id) doesn't exist, so this job
  # failed on every push to main and was skipped on PRs.
  dast-scan:
    name: Dynamic Application Security Testing (DAST)
    runs-on: ubuntu-latest
    needs: security-audit

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.4'
        extensions: mbstring, xml, ctype, iconv, sqlite3, pdo_sqlite
        coverage: none

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'npm'

    - name: Install Dependencies
      run: |
        composer install --prefer-dist --no-progress --no-interaction
        npm ci --ignore-scripts
        npm run build

    - name: Boot App (production settings)
      run: |
        cp .env.example .env
        sed -i 's/^APP_ENV=.*/APP_ENV=production/; s/^APP_DEBUG=.*/APP_DEBUG=false/' .env
        php artisan key:generate --force
        touch database/database.sqlite
        php artisan migrate --force
        nohup php artisan serve --host=127.0.0.1 --port=8000 > storage/logs/serve.log 2>&1 &
        curl -sf --retry 30 --retry-connrefused --retry-delay 1 http://127.0.0.1:8000/up > /dev/null

    - name: Allow ZAP to write its report
      run: chmod a+w "$GITHUB_WORKSPACE"

    - name: OWASP ZAP Baseline Scan
      uses: zaproxy/action-baseline@v0.12.0
      with:
        target: 'http://127.0.0.1:8000'
        rules_file_name: '.zap/rules.tsv'
        cmd_options: '-a'
        # Findings go to the zap_scan artifact; opening issues needs write
        # permissions this workflow doesn't grant.
        allow_issue_writing: false
