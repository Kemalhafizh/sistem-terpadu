name: 🚀 SISTA Automated Deployment

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

concurrency:
  group: deployment-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: 🚀 Deploy to Production Server
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # Until the school has a production server, the SSH secrets are empty and
      # the deploy is skipped with a note instead of failing every merge.
      - name: Check Production Server Configuration
        id: server
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
        run: |
          if [ -n "$SERVER_HOST" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Deploy dilewati::Secret SERVER_HOST belum diisi, jadi belum ada server produksi untuk dideploy."
            echo "Deploy dilewati: secret \`SERVER_HOST\` belum diisi (belum ada server produksi)." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Deploy Code via Secure SSH
        if: steps.server.outputs.configured == 'true'
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          passphrase: ${{ secrets.SSH_PASSPHRASE }}
          port: ${{ secrets.SERVER_PORT || '22' }}
          script: |
            echo "=================================================="
            echo "    Starting SISTA Automated Deployment Sequence   "
            echo "=================================================="
            
            # Navigate to base directory
            cd /var/www/sistem-terpadu
            
            # Active maintenance mode
            php artisan down --refresh=15 || true
            
            # Pull latest commits
            git pull origin main
            
            # Install optimal composer dependencies
            composer install --no-dev --optimize-autoloader --no-interaction
            
            # Execute database updates safely
            php artisan migrate --force
            
            # Clear and rebuild cache layers for optimal speed
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache
            php artisan event:cache
            
            # Build front-end assets in production mode
            npm ci
            npm run build
            
            # Restart asynchronous workers
            php artisan queue:restart
            
            # Re-activate application
            php artisan up
            
            # Execute System Operational Health Checks
            php artisan app:health-check
            
            echo "=================================================="
            echo " Deployment Completed and Verified Successfully! "
            echo "=================================================="
