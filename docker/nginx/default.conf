server {
    listen 80;
    index index.php index.html;
    error_log  /var/log/nginx/error.log;
    access_log /var/log/nginx/access.log;
    root /var/www/public;
    client_max_body_size 100M;

    # Don't advertise the nginx version in headers and error pages.
    server_tokens off;

    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        fastcgi_read_timeout 300;
        fastcgi_connect_timeout 300;
        fastcgi_send_timeout 300;
        # Laravel's SecurityHeaders middleware sets the security headers for
        # PHP responses; only strip PHP's version banner here.
        fastcgi_hide_header X-Powered-By;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
        gzip_static on;

        # Files nginx serves itself (build assets, service worker, images)
        # never reach Laravel's SecurityHeaders middleware. Requests that fall
        # through to index.php are answered in the PHP location, so these
        # don't duplicate the headers Laravel sends. SAMEORIGIN, not DENY: the
        # library e-book reader shows /storage PDFs in a same-origin iframe.
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(self)" always;
    }
}
