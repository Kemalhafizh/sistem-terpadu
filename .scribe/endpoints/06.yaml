      description: 'Mengambil daftar 20 pengumuman aktif sekolah terbaru yang didelegasikan untuk tipe peran Anda.'
      authenticated: true
      deprecated: false
    headers:
      Authorization: 'Bearer {YOUR_AUTH_KEY}'
      Content-Type: application/json
      Accept: application/json
    urlParameters: []
    cleanUrlParameters: []
    queryParameters: []
    cleanQueryParameters: []
    bodyParameters: []
    cleanBodyParameters: []
    fileParameters: []
    responses:
      -
        custom: []
        status: 401
        content: '{"message":"Unauthenticated."}'
        headers:
          cache-control: 'no-cache, private'
          content-type: application/json
          x-content-type-options: nosniff
          x-frame-options: SAMEORIGIN
          x-xss-protection: '1; mode=block'
          referrer-policy: strict-origin-when-cross-origin
          permissions-policy: 'camera=(), microphone=(), geolocation=(self)'
          content-security-policy: "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://cdn.jsdelivr.net https://app.midtrans.com https://sandbox.midtrans.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdn.jsdelivr.net; font-src 'self' https://fonts.gstatic.com https://cdn.jsdelivr.net; img-src 'self' data: https:; frame-src 'self' https://app.midtrans.com https://sandbox.midtrans.com; connect-src 'self' ws: wss: https://api.sandbox.midtrans.com https://api.midtrans.com;"
          access-control-allow-origin: '*'
        description: null
    responseFields: []
    auth:
      - headers
      - Authorization
      - 'Bearer 6g43cv8PD1aE5beadkZfhV6'
    controller: null
    method: null
    route: null
