name: 'Mobile Application Data'
description: |-

  API endpoint untuk mengambil data akademik, keuangan, dan islami
  untuk ditampilkan di aplikasi mobile siswa atau orang tua.
endpoints:
  -
    custom: []
    httpMethods:
      - GET
    uri: api/v1/students
    metadata:
      custom: []
      groupName: 'Mobile Application Data'
      groupDescription: |-

        API endpoint untuk mengambil data akademik, keuangan, dan islami
        untuk ditampilkan di aplikasi mobile siswa atau orang tua.
      subgroup: ''
      subgroupDescription: ''
      title: 'Get Students List'
      description: |-
        Mengambil daftar siswa yang berelasi dengan akun yang sedang login.
        Jika login sebagai `parent`, akan mengembalikan daftar anak-anaknya.
        Jika login sebagai `student`, mengembalikan data dirinya sendiri.
      authenticated: true
      deprecated: false
    headers:
      Authorization: 'Bearer {YOUR_AUTH_KEY}'
      Content-Type: application/json
      Accept: application/json
    urlParameters: []
    cleanUrlParameters: []
    queryParameters: []
    cleanQueryParameters: []
    bodyParameters: []
    cleanBodyParameters: []
    fileParameters: []
    responses:
      -
        custom: []
        status: 401
        content: '{"message":"Unauthenticated."}'
        headers:
          cache-control: 'no-cache, private'
          content-type: application/json
          x-content-type-options: nosniff
          x-frame-options: SAMEORIGIN
          x-xss-protection: '1; mode=block'
          referrer-policy: strict-origin-when-cross-origin
          permissions-policy: 'camera=(), microphone=(), geolocation=(self)'
          content-security-policy: "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://cdn.jsdelivr.net https://app.midtrans.com https://sandbox.midtrans.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdn.jsdelivr.net; font-src 'self' https://fonts.gstatic.com https://cdn.jsdelivr.net; img-src 'self' data: https:; frame-src 'self' https://app.midtrans.com https://sandbox.midtrans.com; connect-src 'self' ws: wss: https://api.sandbox.midtrans.com https://api.midtrans.com;"
          access-control-allow-origin: '*'
        description: null
    responseFields: []
    auth:
      - headers
      - Authorization
      - 'Bearer 6g43cv8PD1aE5beadkZfhV6'
    controller: null
    method: null
    route: null
