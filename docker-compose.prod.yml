# Production Docker Compose — override for production deployment
# Usage: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d

services:

  app:
    build:
      target: production
    restart: always
    environment:
      APP_ENV: production
      APP_DEBUG: "false"

  web:
    restart: always

  mysql:
    restart: always
    ports: []  # Don't expose MySQL in production

  redis:
    restart: always
    ports: []  # Don't expose Redis in production
